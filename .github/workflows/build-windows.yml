name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: |
          pyinstaller --noconfirm --clean --windowed --name "BookCaptureAI" --collect-all pygetwindow app.py

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/BookCaptureAI/*" -DestinationPath "BookCaptureAI-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookCaptureAI-windows
          path: BookCaptureAI-windows.zip
