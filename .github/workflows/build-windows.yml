name: Build Windows EXE v0.5.8 fixed-count capture

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - ".latest-build.json"
      - ".current-build.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Compile source
        run: python -m py_compile app.py app_v4.py app_v5.py app_v6.py capture_engine.py pdf_tools.py split_tools.py

      - name: Test source
        run: python -m pytest -q

      - name: Test exact fixed-count capture
        run: python -m pytest -q tests/test_fixed_count.py

      - name: Test post-processing QThread
        run: python -m pytest -q tests/test_post_process.py

      - name: Test v0.5.8 UI self-test from source
        shell: pwsh
        run: |
          $report = Join-Path $PWD "source-selftest-v058.json"
          python app_v6.py --self-test $report
          if ($LASTEXITCODE -ne 0) { throw "Source self-test failed" }
          Get-Content $report
          $json = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $json.ok) { throw "Source self-test returned ok=false" }
          if ($json.version -ne "0.5.8") { throw "Wrong source version" }
          if (-not $json.checks.fixed_mode_exists) { throw "Fixed-count UI missing" }
          if (-not $json.checks.same_stop_disabled_in_fixed) { throw "Same-screen stop is active in fixed mode" }
          if (-not $json.checks.cancel_button_exists) { throw "Cancel-without-PDF button missing" }
          if (-not $json.checks.f7_removed_from_help) { throw "F7 start was not removed" }

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --name "BookCaptureAI" --collect-all pygetwindow app_v6.py

      - name: Bundle Tesseract OCR
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "tesseract-installer.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "Tesseract-OCR"
          $ocrDir = Join-Path $PWD "dist/BookCaptureAI/ocr"

          Invoke-WebRequest `
            -Uri "https://github.com/tesseract-ocr/tesseract/releases/download/5.5.0/tesseract-ocr-w64-setup-5.5.0.20241111.exe" `
            -OutFile $installer

          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          & 7z x $installer "-o$installDir" -y | Write-Output
          if ($LASTEXITCODE -ne 0) { throw "Could not extract Tesseract Windows package" }

          $tesseractExe = Get-ChildItem -Path $installDir -Filter "tesseract.exe" -Recurse | Select-Object -First 1
          if (-not $tesseractExe) { throw "tesseract.exe was not found after extraction" }
          $runtimeDir = $tesseractExe.Directory.FullName

          New-Item -ItemType Directory -Force -Path $ocrDir | Out-Null
          Copy-Item -Path (Join-Path $runtimeDir "*") -Destination $ocrDir -Recurse -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $ocrDir "tessdata") | Out-Null

          foreach ($model in @("eng", "jpn", "jpn_vert", "osd")) {
            Invoke-WebRequest `
              -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$model.traineddata" `
              -OutFile (Join-Path $ocrDir "tessdata/$model.traineddata")
          }

          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tesseract/main/LICENSE" -OutFile (Join-Path $ocrDir "LICENSE-Tesseract.txt")
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/LICENSE" -OutFile (Join-Path $ocrDir "LICENSE-tessdata_fast.txt")
          Copy-Item "THIRD-PARTY-NOTICES.md" (Join-Path $ocrDir "THIRD-PARTY-NOTICES.md")

          & (Join-Path $ocrDir "tesseract.exe") --version
          $langs = & (Join-Path $ocrDir "tesseract.exe") --list-langs 2>&1
          foreach ($requiredLang in @("eng", "jpn", "jpn_vert")) {
            if ($langs -notcontains $requiredLang) { throw "Missing OCR language: $requiredLang" }
          }

      - name: Test clean split pages plus OCR integration
        shell: pwsh
        run: |
          Copy-Item "dist/BookCaptureAI/ocr" "ocr" -Recurse -Force
          @'
          from pathlib import Path
          import os
          from PIL import Image, ImageDraw, ImageFont
          from pypdf import PdfReader
          from pdf_tools import configure_tesseract, make_ocr_outputs
          from split_tools import split_spreads

          base = Path("v058-integration-test")
          spreads = base / "images"
          spreads.mkdir(parents=True, exist_ok=True)
          image = Image.new("RGB", (1400, 1000), "white")
          draw = ImageDraw.Draw(image)
          draw.rectangle((0, 0, 1399, 79), fill="red")
          draw.rectangle((0, 940, 1399, 999), fill="blue")
          font_path = Path(os.environ["WINDIR"]) / "Fonts" / "arial.ttf"
          font = ImageFont.truetype(str(font_path), 64)
          draw.text((80, 300), "LEFT PAGE 11111", fill="black", font=font)
          draw.text((780, 300), "RIGHT PAGE 12345", fill="black", font=font)
          image.save(spreads / "page-0001.png")

          split_dir = base / "images-split"
          pages = split_spreads(spreads, split_dir, order="rtl", top_crop_pct=8.0, bottom_crop_pct=6.0)
          assert len(pages) == 2
          with Image.open(pages[0]) as p:
            assert p.size == (700, 860), p.size
            assert p.getpixel((10, 0)) == (255, 255, 255)
            assert p.getpixel((10, p.height - 1)) == (255, 255, 255)

          info = configure_tesseract()
          assert info["available"], info
          assert info["source"] == "bundled", info

          searchable = base / "searchable.pdf"
          text_file = base / "text.txt"
          make_ocr_outputs(split_dir, searchable, text_file, "eng")
          assert searchable.exists() and len(PdfReader(str(searchable)).pages) == 2
          text = text_file.read_text(encoding="utf-8")
          assert "12345" in text, text
          assert "11111" in text, text
          print(info)
          print(text)
          '@ | python -
          Remove-Item "ocr" -Recurse -Force

      - name: Self-test packaged EXE
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest-v058.json"
          $exe = Resolve-Path "dist/BookCaptureAI/BookCaptureAI.exe"
          $p = Start-Process -FilePath $exe -ArgumentList @("--self-test", $report) -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "Packaged EXE self-test failed. ExitCode=$($p.ExitCode)"
          }
          if (-not (Test-Path $report)) { throw "Self-test report missing" }
          Get-Content $report
          $json = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $json.ok) { throw "Self-test returned ok=false" }
          if ($json.version -ne "0.5.8") { throw "Wrong app version in packaged self-test" }
          if (-not $json.checks.fixed_mode_exists) { throw "Fixed-count mode missing from packaged EXE" }
          if (-not $json.checks.same_stop_disabled_in_fixed) { throw "Fixed mode still enables same-screen stop" }
          if (-not $json.checks.cancel_button_exists) { throw "Cancel button missing from packaged EXE" }
          if (-not $json.checks.countdown_cancel_resets) { throw "Countdown cancel self-test failed" }

      - name: Verify package contents
        shell: pwsh
        run: |
          $root = "dist/BookCaptureAI"
          $required = @(
            "$root/BookCaptureAI.exe",
            "$root/_internal",
            "$root/ocr/tesseract.exe",
            "$root/ocr/tessdata/jpn.traineddata",
            "$root/ocr/tessdata/jpn_vert.traineddata",
            "$root/ocr/tessdata/eng.traineddata",
            "$root/ocr/LICENSE-Tesseract.txt",
            "$root/ocr/LICENSE-tessdata_fast.txt"
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Missing package item: $item" }
          }

      - name: Create release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/BookCaptureAI/*" -DestinationPath "Book-Capture-AI-v0.5.8.zip" -Force
          if (-not (Test-Path "Book-Capture-AI-v0.5.8.zip")) { throw "Release ZIP missing" }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Book-Capture-AI-v0.5.8-Windows
          path: Book-Capture-AI-v0.5.8.zip
          if-no-files-found: error

      - name: Record latest successful build run
        shell: pwsh
        run: |
          git pull --rebase
          $data = @{
            run_id = [int64]$env:GITHUB_RUN_ID
            artifact = "Book-Capture-AI-v0.5.8-Windows"
            commit = $env:GITHUB_SHA
            version = "0.5.8"
            status = "success"
          } | ConvertTo-Json
          Set-Content -Path ".latest-build.json" -Value $data -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .latest-build.json
          git commit -m "Record latest successful v0.5.8 Windows build" || exit 0
          git push
