name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Test source
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --name "BookCaptureAI" --collect-all pygetwindow app.py

      - name: Smoke-test packaged EXE startup
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/BookCaptureAI/BookCaptureAI.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            throw "Packaged EXE exited during startup smoke test. ExitCode=$($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force

      - name: Verify package contents
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/BookCaptureAI/BookCaptureAI.exe")) { throw "EXE missing" }
          if (-not (Test-Path "dist/BookCaptureAI/_internal")) { throw "PyInstaller runtime missing" }

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: BookCaptureAI-Windows-v0.2
          path: dist/BookCaptureAI/
