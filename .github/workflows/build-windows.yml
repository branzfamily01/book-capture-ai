name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Test source
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --name "BookCaptureAI" --collect-all pygetwindow app.py

      - name: Self-test packaged EXE
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest.json"
          $exe = Resolve-Path "dist/BookCaptureAI/BookCaptureAI.exe"
          $p = Start-Process -FilePath $exe -ArgumentList @("--self-test", $report) -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "Packaged EXE self-test failed. ExitCode=$($p.ExitCode)"
          }
          if (-not (Test-Path $report)) { throw "Self-test report missing" }
          Get-Content $report
          $json = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $json.ok) { throw "Self-test returned ok=false" }

      - name: Verify package contents
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/BookCaptureAI/BookCaptureAI.exe")) { throw "EXE missing" }
          if (-not (Test-Path "dist/BookCaptureAI/_internal")) { throw "PyInstaller runtime missing" }

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: BookCaptureAI-Windows-v0.2
          path: dist/BookCaptureAI/
